# Создаёт GitHub Release при пуше тега v* (файл workflow должен быть на default branch).
name: GitHub Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: DFC Manager ${{ github.ref_name }}
          generate_release_notes: true
